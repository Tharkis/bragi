name: Jellyfin plugin

on:
  push:
    branches: [main]
    paths: ["jellyfin-plugin/**", ".github/workflows/jellyfin-plugin.yml"]
    tags: ["plugin-v*"]
  pull_request:
    paths: ["jellyfin-plugin/**", ".github/workflows/jellyfin-plugin.yml"]
  # Publish a release from the Actions tab: Run workflow, enter a version.
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to release, e.g. 0.1.0 (creates tag plugin-v<version>)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check the web script parses
        run: node --check jellyfin-plugin/Jellyfin.Plugin.Bragi/Web/bragi.js
      - name: Build
        run: dotnet build jellyfin-plugin/Jellyfin.Plugin.Bragi -c Release
      - name: Package
        run: |
          mkdir -p out/Bragi
          cp jellyfin-plugin/Jellyfin.Plugin.Bragi/bin/Release/net10.0/Jellyfin.Plugin.Bragi.dll out/Bragi/
          cd out && zip -r ../jellyfin-plugin-bragi.zip Bragi
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-bragi
          path: jellyfin-plugin-bragi.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/plugin-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('plugin-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Jellyfin plugin {0}', inputs.version) || github.ref_name }}
          files: jellyfin-plugin-bragi.zip
