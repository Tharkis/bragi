# Copy to docker-compose.yml and adjust the paths.
services:
  bragi:
    image: ghcr.io/tharkis/bragi:latest
    container_name: bragi
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      # Downloads and media under one mount so imports can hardlink.
      - /path/to/data:/data
